<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f5f5f5;
}

header{
background:#1e3d59;
color:white;
text-align:center;
padding:20px;
}

.formsec{
display:flex;
justify-content:center;
padding:50px;
}

form{
background:white;
padding:30px;
width:400px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

form h2{
text-align:center;
margin-bottom:20px;
}

input, select, textarea{
width:100%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#ff7b00;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

footer{
background:#1e3d59;
color:white;
text-align:center;
padding:15px;
margin-top:40px;
}

</style>

</head>

<body>

<header>
<h1>Aurora Routes Enquiry</h1>
</header>

<div class="formsec">

<form>

<h2>Book Your Trip</h2>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Phone Number" required>

<select required>
<option>Select Destination</option>
<option>Japan</option>
<option>Maldives</option>
<option>Manali</option>
<option>Vietnam</option>
<option>Paris</option>
<option>Dubai</option>
</select>

<input type="number" placeholder="Number of Travelers">

<textarea rows="4" placeholder="Any Special Requests"></textarea>

<button type="submit">Submit Enquiry</button>

</form>

</div>

<footer>
<p>© 2026 Dream Travel</p>
</footer>

</body>
</html>
