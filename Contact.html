
<!DOCTYPE html>
<html>
<head>
<title>Contact Us</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f5f5f5;
}

header{
background:#1e3d59;
color:white;
text-align:center;
padding:20px;
}
.contactinfo{
text-align:center;
padding:40px;
background:white;
line-height:1.8;
}
.contact-box{
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
margin-top:30px;
}

.contact-card{
background:#f9f9f9;
padding:20px;
width:220px;
border-radius:10px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.contact-card h3{
color:#ff7b00;
margin-bottom:10px;
}
.feedback{
display:flex;
justify-content:center;
padding:40px;
}

form{
background:white;
padding:30px;
width:400px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

form h2{
text-align:center;
margin-bottom:20px;
}

input, textarea{
width:100%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#ff7b00;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

footer{
background:#1e3d59;
color:white;
text-align:center;
padding:15px;
margin-top:40px;
}

</style>

</head>

<body>

<header>
<h1>Contact Aurora Routes</h1>
</header>

<section class="contactinfo">

<div class="contact-box">

<div class="contact-card">
<h3>Phone</h3>
<p>+91 89397 31732</p>
<p>+91 91234 56789</p>
</div>

<div class="contact-card">
<h3>Email</h3>
<p>priyadharshini.k2728@gmail.com</p>
<p>support@dreamtravel.com</p>
</div>

<div class="contact-card">
<h3>Location</h3>
<p>Chennai, India</p>
<p>Available 24/7</p>
</div>

</div>
</section>

<section class="feedback">

<form>

<h2>Send Feedback</h2>

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<textarea rows="4" placeholder="Write your feedback"></textarea>

<button type="submit">Submit</button>

</form>

</section>

<footer>
<p>© 2026 Aurora Routes</p>
</footer>

</body>
</html>
